<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecyPrint | History Logs</title>
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            background-color: rgba(14, 165, 233, 0.1);
            color: var(--accent-primary);
            font-family: var(--font-display);
            letter-spacing: 1px;
            font-weight: 600;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .btn-export {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
            padding: 10px 20px;
            text-decoration: none;
            font-family: var(--font-display);
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .btn-export:hover {
            background: var(--success);
            color: #fff;
            box-shadow: 0 0 15px var(--success);
        }

        .btn-back {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-back:hover {
            color: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="glass-panel" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo">
                <span class="neon-text">RECY</span>PRINT <span style="color:var(--text-muted); font-size:1.2rem;">/ Reports</span>
            </div>
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <a href="/" class="btn-back">⬅ Return to Live Dashboard</a>
                <a href="/logout" style="color: var(--danger); text-decoration: none; font-weight: bold; font-family: var(--font-display); background: rgba(239, 68, 68, 0.1); padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.3); transition: 0.3s; font-size: 0.9rem;">🚪 LOG OUT</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="panel glass-panel">
            <div class="action-bar" style="flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h2 class="panel-title" style="margin-bottom: 5px; border:none; padding:0;">Historical Sensor Logs</h2>
                    <p style="color:var(--text-muted); font-size:0.9rem;">Viewing the last 100 recorded data points from the system's database.</p>
                </div>
                <div style="display: flex; gap: 0.8rem; align-items: center; background: rgba(0,0,0,0.3); padding: 10px 15px; border-radius: 10px; border: 1px solid var(--glass-border); flex-wrap: wrap;">
                    <label style="font-size: 0.85rem; color: var(--text-muted); font-family: var(--font-display);">From:</label>
                    <input type="date" id="start-date" style="padding: 8px; border-radius: 6px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: #fff; font-size: 0.85rem; outline: none; font-family: var(--font-display);">
                    <label style="font-size: 0.85rem; color: var(--text-muted); font-family: var(--font-display);">To:</label>
                    <input type="date" id="end-date" style="padding: 8px; border-radius: 6px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: #fff; font-size: 0.85rem; outline: none; font-family: var(--font-display);">
                    <button id="btn-filter-table" class="btn-export glow-effect" style="cursor: pointer; font-size: 0.85rem; padding: 8px 16px; background: rgba(14, 165, 233, 0.15); border-color: var(--accent-primary); color: var(--accent-primary);">🔍 Filter Table</button>
                    <button id="btn-filter-export" class="btn-export glow-effect" style="cursor: pointer; font-size: 0.85rem; padding: 8px 16px;">⬇ Export CSV</button>
                </div>
            </div>

            <div class="table-container">
                <table id="logs-table">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Temperature (°C)</th>
                            <th>Motor Speed (0-255)</th>
                            <th>Filament Diameter (mm)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="4" style="text-align:center;">Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        function loadLogs(start = '', end = '') {
            const tbody = document.querySelector('#logs-table tbody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Loading records...</td></tr>';
            
            let url = '/api/logs';
            if (start && end) {
                url += `?start_date=${start}&end_date=${end}`;
            } else if (start) {
                url += `?start_date=${start}`;
            } else if (end) {
                url += `?end_date=${end}`;
            }

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    tbody.innerHTML = '';
                    
                    if(data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No sensor data recorded in this range.</td></tr>';
                        return;
                    }

                    data.forEach(log => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="color:var(--text-muted);">${log.timestamp}</td>
                            <td style="font-weight:bold; color:var(--accent-primary);">${log.temperature.toFixed(2)}</td>
                            <td>${log.speed.toFixed(1)}</td>
                            <td>${log.diameter.toFixed(3)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--danger);">Error loading logs.</td></tr>';
                    console.error(err);
                });
        }

        // Fetch logs on page load
        loadLogs();

        // Handle Table Filter
        document.getElementById('btn-filter-table').addEventListener('click', () => {
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            loadLogs(start, end);
        });

        // Handle CSV export with date filters
        document.getElementById('btn-filter-export').addEventListener('click', () => {
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            let url = '/export/csv';
            
            if (start && end) {
                url += `?start_date=${start}&end_date=${end}`;
            } else if (start) {
                url += `?start_date=${start}`;
            } else if (end) {
                url += `?end_date=${end}`;
            }
            
            window.location.href = url;
        });
    </script>
</body>
</html>
